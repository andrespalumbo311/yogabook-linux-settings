# iwd Wireless Daemon Configuration (Yoga Book YB1-X91F)

[General]
# Disable nl80211 control port for EAPoL; FullMAC brcmfmac drops/misses GTK rekeys over netlink.
# Raw PAE Ethernet socket ensures reliable 2-way GTK rekey and prevents 10-minute deauths.
ControlPortOverNL80211=false

# Roaming RSSI thresholds for 802.11 mesh networks (AVM Fritz! mesh)
RoamThreshold=-70
RoamRetryInterval=60

[DriverQuirks]
DefaultInterface=brcmfmac
ForcePae=brcmfmac
PowerSaveDisable=brcmfmac
