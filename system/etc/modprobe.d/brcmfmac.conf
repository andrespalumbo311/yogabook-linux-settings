# Broadcom FullMAC PCIe WiFi Tuning (Yoga Book YB1-X91F)
# Disable unstable on-chip firmware roaming engine; delegate roaming cleanly to userland (iwd)
# Disable firmware supplicant (0x2000 FWSUP) and SAE (0x80000) offload to prevent 10-minute GTK rekey drops
options brcmfmac roamoff=1 feature_disable=0x82000
