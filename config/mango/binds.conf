# ==============================================================================
# Native MangoWC Key & Gesture Bindings (Decoupled from DMS)
# Configured for Niri-like Infinite Scroller & Fluid Navigation
# ==============================================================================

# === Application Launchers ===
bind=SUPER,t,spawn,foot
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,/home/andres/.local/bin/toggle-launcher
bind=SUPER,c,spawn,/home/andres/.local/bin/toggle-control-center
bind=SUPER,n,spawn,/home/andres/.local/bin/toggle-control-center
bind=SUPER,k,spawn,/home/andres/.local/bin/toggle-keyboard
bind=SUPER,m,spawn,/home/andres/.local/bin/fix-lan-mouse

# === Screenshots ===
bind=none,Print,spawn,sh -c 'grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Area copiata negli appunti"'
bind=CTRL,Print,spawn,sh -c 'grim - | wl-copy && notify-send "Screenshot" "Schermo intero copiato negli appunti"'

# === Audio Controls (Wireplumber / PipeWire) ===
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 3%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioPause,spawn,playerctl pause
bind=none,XF86AudioPrev,spawn,playerctl previous
bind=none,XF86AudioNext,spawn,playerctl next

# === Brightness Controls ===
bind=none,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=none,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# === Window Management (Niri Parity) ===
bind=SUPER,q,killclient,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER,o,toggleoverview
bind=ALT,Tab,toggleoverview
bind=SUPER+SHIFT,e,quit,

# Preset column / window widths (Mod+R in Niri)
bind=SUPER,r,switch_proportion_preset

# Scroller stack manipulation (consume/expel column windows)
bind=SUPER,BracketLeft,scroller_stack,left
bind=SUPER,BracketRight,scroller_stack,right
bind=SUPER,Comma,scroller_stack,down
bind=SUPER,Period,scroller_stack,up

# === Focus Navigation ===
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=SUPER,Left,focusdir,left
bind=SUPER,H,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,L,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,K,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,J,focusdir,down

# === Window Movement (Shift + Arrows/HJKL or Ctrl + Arrows/HJKL like Niri) ===
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,L,exchange_client,right
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,J,exchange_client,down

bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,H,exchange_client,left
bind=SUPER+CTRL,L,exchange_client,right
bind=SUPER+CTRL,K,exchange_client,up
bind=SUPER+CTRL,J,exchange_client,down

# === Monitor Navigation ===
bind=SUPER+ALT,Left,focusmon,left
bind=SUPER+ALT,Right,focusmon,right
bind=SUPER+ALT+SHIFT,Left,tagmon,left
bind=SUPER+ALT+SHIFT,Right,tagmon,right

# === Layout Management ===
bind=SUPER+ALT,j,switch_layout
bind=SUPER+SHIFT,equal,incgaps,1
bind=SUPER+SHIFT,minus,incgaps,-1

# === Tags (1-9): view tag ===
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# === Tags (1-9): move focused window to tag ===
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# === Touchpad Gestures (Niri Parity) ===
# 3 fingers swipe horizontal -> scroll through windows
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
# 3 fingers swipe vertical -> switch workspaces (tags)
gesturebind=none,up,3,viewtoright
gesturebind=none,down,3,viewtoleft

# 4 fingers swipe vertical -> toggle overview
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
# 4 fingers swipe horizontal -> switch tags/workspaces
gesturebind=none,left,4,viewtoright
gesturebind=none,right,4,viewtoleft

# === Trackpad / Mouse Axis Scrolling with Super (Niri Parity & Lan Mouse) ===
# Super + Scroll Horizontal -> scroll windows
axisbind=SUPER,RIGHT,focusdir,right
axisbind=SUPER,LEFT,focusdir,left
# Super + Scroll Vertical -> switch workspaces
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright
# Super + Ctrl + Scroll Horizontal -> move window position
axisbind=SUPER+CTRL,RIGHT,exchange_client,right
axisbind=SUPER+CTRL,LEFT,exchange_client,left
axisbind=SUPER+SHIFT,DOWN,focusdir,right
axisbind=SUPER+SHIFT,UP,focusdir,left
