# ==============================================================================
# MangoWC Optimized Configuration
# Tuned for minimal CPU, RAM, and GPU footprint on low-power hardware
# ==============================================================================

# Session & Environment Autostart
exec-once=dbus-update-activation-environment --systemd --all
exec-once=systemctl --user start mango-session.target
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Display outputs and cursor
source=./outputs.conf
source=./cursor.conf

# ------------------------------------------------------------------------------
# Performance & Resource Optimization
# ------------------------------------------------------------------------------

# Disable blur shaders (SceneFX multi-pass Kawase blur severely impacts low-power GPUs)
blur=0
blur_layer=0
blur_optimized=1

# Disable drop shadows (removes offscreen shadow clipping and blur overhead)
shadows=0
layer_shadows=0

# Disable animations completely (eliminates continuous 60fps tick timer & scene recomputations)
animations=0
layer_animations=0

# Full opacity avoids alpha blending passes in the compositor pipeline
focused_opacity=1.0
unfocused_opacity=1.0

# Disable costly drag computations and features
drag_tile_to_tile=0
drag_tile_small=0
enable_floating_snap=0
enable_hotarea=0

# Hardware & System responsiveness
syncobj_enable=1
xwayland_persistence=1
warpcursor=1
sloppyfocus=1

# ------------------------------------------------------------------------------
# Appearance & Rounded Corners
# ------------------------------------------------------------------------------

# Rounded corners for all program windows
border_radius=10
no_radius_when_single=0

# Borders and gaps
borderpx=2
gappih=4
gappiv=4
gappoh=6
gappov=6

# Clean window colors
rootcolor=0x1e1e2eff
bordercolor=0x313244ff
focuscolor=0x89b4faff
urgentcolor=0xf38ba8ff

# ------------------------------------------------------------------------------
# Input, Trackpad & Touchscreen
# ------------------------------------------------------------------------------
# Trackpad (inverts two-finger scrolling direction)
trackpad_natural_scrolling=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
devicerule=name:virtual-touchpad,natural_scrolling:1

# Touchscreen (mapped to display DSI-1 and enabled mouse emulation for non-touch apps)
touch_enable=1
touch_enable_mouse_emulation=1
touch_map_to_mon=DSI-1
tablet_map_to_mon=DSI-1

# Mouse bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# ------------------------------------------------------------------------------
# Key Bindings
source=./binds.conf

# ------------------------------------------------------------------------------
# Workspace / Tag Switching (Super + 1..9, Super + Numpad 1..9)
# ------------------------------------------------------------------------------
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER,KP_1,view,1
bind=SUPER,KP_2,view,2
bind=SUPER,KP_3,view,3
bind=SUPER,KP_4,view,4
bind=SUPER,KP_5,view,5
bind=SUPER,KP_6,view,6
bind=SUPER,KP_7,view,7
bind=SUPER,KP_8,view,8
bind=SUPER,KP_9,view,9

# Move focused window to workspace (Super + Shift + 1..9)
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

bind=SUPER+SHIFT,KP_1,tag,1
bind=SUPER+SHIFT,KP_2,tag,2
bind=SUPER+SHIFT,KP_3,tag,3
bind=SUPER+SHIFT,KP_4,tag,4
bind=SUPER+SHIFT,KP_5,tag,5
bind=SUPER+SHIFT,KP_6,tag,6
bind=SUPER+SHIFT,KP_7,tag,7
bind=SUPER+SHIFT,KP_8,tag,8
bind=SUPER+SHIFT,KP_9,tag,9
