# ==============================================================================
# MangoWC Optimized Configuration
# Tuned for minimal CPU, RAM, and GPU footprint on low-power hardware
# ==============================================================================

# Session & Environment Autostart
exec_once=dbus-update-activation-environment --systemd --all
exec_once=systemctl --user reset-failed
exec_once=systemctl --user start mango-session.target

# Display outputs and cursor
source=./outputs.conf
source=./cursor.conf

# ------------------------------------------------------------------------------
# Performance & Resource Optimization
# ------------------------------------------------------------------------------

# Disable blur shaders (SceneFX multi-pass Kawase blur severely impacts low-power GPUs)
blur=0
blur_layer=0
blur_optimized=1

# Disable drop shadows (removes offscreen shadow clipping and blur overhead)
shadows=0
layer_shadows=0

# Disable animations completely (eliminates continuous 60fps tick timer & scene recomputations)
animations=0
layer_animations=0

# Full opacity avoids alpha blending passes in the compositor pipeline
focused_opacity=1.0
unfocused_opacity=1.0

# Disable costly drag computations and features
drag_tile_to_tile=0
drag_tile_small=0
enable_floating_snap=0
enable_hotarea=0

# Hardware & System responsiveness
sync_obj_enable=1
xwayland_persistence=0
warp_cursor=1
sloppy_focus=1

# ------------------------------------------------------------------------------
# Appearance & Rounded Corners
# ------------------------------------------------------------------------------

# Rounded corners disabled for zero-overhead direct scanout (no fragment shader clipping)
border_radius=0
no_radius_when_single=1

# Borders and gaps (zero gaps eliminate background redraw/blending under tiled windows)
border_px=2
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0

# Clean window colors
root_color=0x1e1e2eff
border_color=0x313244ff
focus_color=0x89b4faff
urgent_color=0xf38ba8ff

# ------------------------------------------------------------------------------
# Scroller Layout Settings (Niri Parity: Infinite Ribbon & Fullscreen Default)
# ------------------------------------------------------------------------------
scroller_structs=0
scroller_default_proportion=1.0
scroller_default_proportion_single=1.0
scroller_ignore_proportion_single=0
scroller_focus_center=1
scroller_prefer_center=0
scroller_prefer_overspread=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_proportion_preset=1.0,0.75,0.5,0.25
circle_layout=scroller,tile,monocle,grid

# Default scroller layout across all tags
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# ------------------------------------------------------------------------------
# Input, Trackpad & Touchscreen
# ------------------------------------------------------------------------------
# Keyboard Layout & Variant (US International with Dead Keys)
xkb_rules_layout=us
xkb_rules_variant=intl

# Trackpad (inverts two-finger scrolling direction)
trackpad_natural_scrolling=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
device_rule=type:trackpad,name:virtual-touchpad,natural_scrolling:1

# Touchscreen (mapped to display DSI-1 and enabled mouse emulation for non-touch apps)
touch_enable=1
device_rule=type:tablet,name:Wacom HID 169 Pen,monitor:DSI-1

# Mouse bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# ------------------------------------------------------------------------------
# Key Bindings
source=./binds.conf

# ------------------------------------------------------------------------------
# Workspace / Tag Switching (Super + Numpad 1..9, Super + 1..9 defined in binds.conf)
# ------------------------------------------------------------------------------
bind=SUPER,KP_1,view,1
bind=SUPER,KP_2,view,2
bind=SUPER,KP_3,view,3
bind=SUPER,KP_4,view,4
bind=SUPER,KP_5,view,5
bind=SUPER,KP_6,view,6
bind=SUPER,KP_7,view,7
bind=SUPER,KP_8,view,8
bind=SUPER,KP_9,view,9

# Move focused window to workspace (Super + Shift + Numpad 1..9)
bind=SUPER+SHIFT,KP_1,tag,1
bind=SUPER+SHIFT,KP_2,tag,2
bind=SUPER+SHIFT,KP_3,tag,3
bind=SUPER+SHIFT,KP_4,tag,4
bind=SUPER+SHIFT,KP_5,tag,5
bind=SUPER+SHIFT,KP_6,tag,6
bind=SUPER+SHIFT,KP_7,tag,7
bind=SUPER+SHIFT,KP_8,tag,8
bind=SUPER+SHIFT,KP_9,tag,9
