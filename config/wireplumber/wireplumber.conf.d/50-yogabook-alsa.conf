# Yoga Book ALSA configuration
# api.alsa.headroom provides DMA safety margin to eliminate XRUNs on low-power Atom SoC
# session.suspend-timeout-seconds allows clean node release when idle and across s2idle suspend
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.platform-cht-yogabook.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.headroom               = 1024
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
