# Yoga Book Native Hardware-Accelerated Speaker DSP Filter-Chain
# Replaces EasyEffects with zero extra memory footprint and 0.0% idle CPU overhead.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "YogaBook DSP Speakers"
            media.name       = "YogaBook DSP Speakers"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_hp
                        label = bq_highpass
                        control = { "Freq" = 150.0 "Q" = 0.707 }
                    }
                    {
                        type  = builtin
                        name  = eq_p180
                        label = bq_peaking
                        control = { "Freq" = 180.0 "Q" = 1.8 "Gain" = -1.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_p2200
                        label = bq_peaking
                        control = { "Freq" = 2200.0 "Q" = 2.0 "Gain" = -3.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_p3200
                        label = bq_peaking
                        control = { "Freq" = 3200.0 "Q" = 2.0 "Gain" = -1.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_p4800
                        label = bq_peaking
                        control = { "Freq" = 4800.0 "Q" = 1.6 "Gain" = 3.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_p7500
                        label = bq_peaking
                        control = { "Freq" = 7500.0 "Q" = 1.6 "Gain" = 1.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_hs11k
                        label = bq_highshelf
                        control = { "Freq" = 11000.0 "Q" = 0.7 "Gain" = 2.0 }
                    }
                ]
                links = [
                    { output = "eq_hp:Out" input = "eq_p180:In" }
                    { output = "eq_p180:Out" input = "eq_p2200:In" }
                    { output = "eq_p2200:Out" input = "eq_p3200:In" }
                    { output = "eq_p3200:Out" input = "eq_p4800:In" }
                    { output = "eq_p4800:Out" input = "eq_p7500:In" }
                    { output = "eq_p7500:Out" input = "eq_hs11k:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "effect_input.yogabook_dsp"
                media.class      = Audio/Sink
                priority.driver  = 1005
                priority.session = 1005
            }
            playback.props = {
                node.name     = "effect_output.yogabook_dsp"
                node.passive  = true
                target.object = "alsa_output.platform-cht-yogabook.pro-output-0"
            }
        }
    }
]
