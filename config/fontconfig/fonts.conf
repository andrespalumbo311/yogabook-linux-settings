<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- ==============================================================================
       Lenovo Yoga Book (YB1-X91F) Font & Emoji Configuration
       Ensures Noto Color Emoji is prioritized for emoji codepoints across all
       generic font families while preserving Adwaita Sans and JetBrainsMono Nerd Font.
       ============================================================================== -->

  <!-- Emoji Generic Family -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- UI & Sans-Serif Font Fallback -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Serif Font Fallback -->
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Adwaita Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Monospace & Terminal Font Fallback -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Propo</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

</fontconfig>
