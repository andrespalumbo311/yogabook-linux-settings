# Brave Browser performance & hardware acceleration flags for Intel Cherryview (Atom x5-Z8550)
# NOTE: User has already installed 'enhanced-h264ify' (blocking VP9/AV1) and disabled Brave bloat (Rewards/Wallet/VPN) in user profile.

--ozone-platform=wayland
--disable-features=Vulkan,WaylandFractionalScaleV1
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoEncoder,CanvasOopRasterization
--enable-gpu-memory-buffer-video-frames
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--renderer-process-limit=4

# Move disk cache to tmpfs (ZRAM) to prevent slow eMMC 4K random write stalls and extend flash lifespan
--disk-cache-dir=/run/user/1000/brave-cache
--disk-cache-size=134217728
