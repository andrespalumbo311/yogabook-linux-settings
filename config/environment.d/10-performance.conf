# Force OpenGL for GTK4 applications (bypasses slow/broken Mesa vulkan_hasvk on Intel Gen8)
GSK_RENDERER=gl

# Session environment class for systemd user units
XDG_SESSION_CLASS=user

# Ample Mesa shader cache size for instant app startups
MESA_SHADER_CACHE_MAX_SIZE=512M

# Default cursor theme and size
XCURSOR_THEME=Bibata-Modern-Ice
XCURSOR_SIZE=24
